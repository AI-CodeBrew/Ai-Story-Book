name: ai_storybook_frontend
description: Flutter frontend for AI-powered storybook application
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Flutter dependencies
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Frontend dependencies
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  intl: ^0.20.2
  connectivity_plus: ^6.1.5
  change_app_package_name: ^1.5.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  pdf: ^3.11.1
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # API Key Pool package (local stand-in — original repo is unreachable, see packages/api_key_pool)
  api_key_pool:
    path: packages/api_key_pool

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

